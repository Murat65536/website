<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <style>
      .cover { fill: #1f2328; }
      .spine { stroke: #0d1117; stroke-width: 1.5; stroke-linecap: round; }
      .ribbon { fill: #0969da; }
      @media (prefers-color-scheme: dark) {
        .cover { fill: #e6edf3; }
        .spine { stroke: #8c959f; }
        .ribbon { fill: #58a6ff; }
      }
    </style>
  </defs>
  <!-- Notebook Cover -->
  <rect class="cover" x="4" y="3" width="24" height="26" rx="3.5" />
  <!-- Spine Crease -->
  <line class="spine" x1="10" y1="3" x2="10" y2="29" />
  <!-- Bookmark Ribbon -->
  <path class="ribbon" d="M17 3v11l3-2.5 3 2.5V3z" />
</svg>
