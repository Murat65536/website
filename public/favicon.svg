<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <style>
      .back-cover { fill: #6e3a1a; }
      .pages { fill: #f5eedb; }
      .cover { fill: #8a4e27; }
      .spine { stroke: #542c12; stroke-width: 1.5; stroke-linecap: round; }
      .ribbon { fill: #d32f2f; }
      @media (prefers-color-scheme: dark) {
        .back-cover { fill: #5c3015; }
        .pages { fill: #e8dfc8; }
        .cover { fill: #9e5b31; }
        .spine { stroke: #6b3616; }
        .ribbon { fill: #ef4444; }
      }
    </style>
  </defs>
  <!-- Back cover -->
  <rect class="back-cover" x="4" y="3" width="24" height="26" rx="3" />
  <!-- Pages edge -->
  <rect class="pages" x="8" y="4.5" width="18.5" height="23" rx="1.5" />
  <!-- Front cover -->
  <path class="cover" d="M4 6a3 3 0 0 1 3-3h17a2 2 0 0 1 2 2v22a2 2 0 0 1-2 2H7a3 3 0 0 1-3-3V6z" />
  <!-- Spine crease -->
  <line class="spine" x1="9.5" y1="3" x2="9.5" y2="29" />
  <!-- Bookmark ribbon -->
  <path class="ribbon" d="M16 3v12l3-2.5 3 2.5V3z" />
</svg>
